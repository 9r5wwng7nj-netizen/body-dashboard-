<style>
  html, body { height: 100%; }

  #app-shell { padding-bottom: env(safe-area-inset-bottom); padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }

<script>
'use strict';
/* =====================================================================
   CORE UTILITIES
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function webUrl(value) {

}
const pad = n => String(n).padStart(2, '0');
const ymd = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const fmtDate = (s, o = { month: 'short', day: 'numeric', year: 'numeric' }) => s ? parseYmd(s).toLocaleDateString(undefined, o) : '';
const fmtDateTime = iso => new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const round = (n, d = 1) => n == null ? null : Math.round(n * 10 ** d) / 10 ** d;
const fmtNum = (n, d = 0) => (n == null || isNaN(n)) ? '–' : Number(round(n, d)).toLocaleString(undefined, { maximumFractionDigits: d });
const sum = arr => arr.reduce((a, b) => a + (+b || 0), 0);
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
const slugTitle = u => { try { const p = new URL(u).pathname.split('/').filter(Boolean); let s = decodeURIComponent(p[p.length - 1] || '').replace(/\.(html?|php|aspx?)$/i, ''); if (/^\d+$/.test(s) && p.length > 1) s = decodeURIComponent(p[p.length - 2]); return s.replace(/[-_]+/g, ' ').replace(/\s+/g, ' ').trim().replace(/\b\w/g, c => c.toUpperCase()).replace(/\b(A|An|The|And|Or|Of|In|On|To|For|With|At|By)\b/g, (w, x, i) => i ? w.toLowerCase() : w); } catch (e) { return ''; } };
const stars = (n, cls = 'text-amber-500') => n ? `<span class="${cls}" aria-label="${n} of 5 stars">${'★'.repeat(n)}<span class="opacity-30">${'★'.repeat(5 - n)}</span></span>` : '';
async function fetchServiceJSON(url, options = {}, timeout = 12000) {
  if (navigator.onLine === false) throw new Error('You are offline. Use saved data or manual entry, then try again when connected.');
  const controller = new AbortController(), cancel = () => controller.abort(); let expired = false;
  if (options.signal?.aborted) cancel(); else options.signal?.addEventListener('abort', cancel, { once: true });
  const timer = setTimeout(() => { expired = true; cancel(); }, timeout);
  try {
    const response = await fetch(url, { ...options, signal: controller.signal });
    const data = response.ok ? await response.json() : null;
    return { response, data };
  } catch (e) {
    if (expired) throw new Error('The service took too long to respond. Try again or use saved data/manual entry.');
    if (e instanceof TypeError) throw new Error('The service could not be reached. Try again or use saved data/manual entry.');
    if (e instanceof SyntaxError) throw new Error('The service returned an unreadable response. Try again later.');
    throw e;
  } finally { clearTimeout(timer); options.signal?.removeEventListener('abort', cancel); }
}
function groupBy(items, keyOf) { // Derived per call: preserve order/identity without stale persistent indexes.
  const groups = new Map();
  for (const item of items) { const key = keyOf(item); if (!groups.has(key)) groups.set(key, []); groups.get(key).push(item); }
  return groups;
}
const startOfWeek = (s = ymd()) => { const d = parseYmd(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); }; // Monday
const fmtDur = sec => { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60); return h ? `${h}h ${m}m` : `${m}m`; };
const fmtClock = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`; };
const dayOfYear = (d = new Date()) => Math.floor((d - new Date(d.getFullYear(), 0, 0)) / 864e5);
const icon = (name, cls = 'w-4 h-4') => `<i data-lucide="${name}" class="${cls}"></i>`;
const parseTags = s => [...new Set(String(s || '').split(/[,\s]+/).map(t => t.replace(/^#/, '').trim().toLowerCase()).filter(Boolean))];
const slug = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const firstLine = s => String(s || '').split('\n').map(l => l.replace(/^[#>*\-\s]+/, '').trim()).find(Boolean) || '';
const fd = form => Object.fromEntries(new FormData(form));
function refreshIcons() { try { window.lucide && lucide.createIcons({ attrs: { 'aria-hidden': 'true', focusable: 'false' } }); } catch (e) {} enhanceAccessibility(); }
function download(name, content, type = 'application/json') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
async function copyText(text, msg = 'Copied to clipboard') {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast(msg);
}
function pickFile(accept, cb, maxBytes = Infinity) {
  const inp = $('#file-input'); inp.value = ''; inp.accept = accept;
  inp.onchange = () => { const f = inp.files[0]; if (!f) return; if (f.size > maxBytes) return toast('That backup exceeds the 256 MB import limit.', 'error'); const r = new FileReader(); r.onload = () => cb(r.result, f); r.onerror = () => toast('Could not read that file', 'error'); r.readAsText(f); };
  inp.click();

/* =====================================================================
   SETTINGS (localStorage)
   ===================================================================== */
const SETTINGS_DEFAULT = {
  name: '', theme: 'system', unit: 'lbs', restSeconds: 90, timerSound: true,
  rpe: false, // show the RPE column in the set logger (sets that already have RPE always show it)
  calBig: 'left', // the big calorie number: 'left' for the day, or 'eaten'
  backupLater: '', // the day the backup reminder was put off; it comes back a week later
  targets: { cal: 2400, p: 180, c: 240, f: 75 },
  collapsed: false, view: 'dashboard', lastExport: null, tour: '', newsSeen: '',
  hiddenTabs: {}, // section tabs the person chose to hide, by section; see tabs()
  tabsV: 0, // which default-hidden tabs have been applied to saved settings (see below)
  hiddenCards: [], // dashboard cards the person chose to hide; see DASH_CARDS
  cardOrder: [], // the dashboard cards' order, by id; empty means the DASH_CARDS order
  bar: ['dashboard', 'fitness', 'nutrition', 'recipes'] // the four sections in the bottom navigation
};
let S = loadSettings();
function loadSettings() {
  try { const s = JSON.parse(localStorage.getItem('bd.settings') || '{}'); return { ...SETTINGS_DEFAULT, ...s, targets: { ...SETTINGS_DEFAULT.targets, ...(s.targets || {}) } }; }
  catch (e) { return structuredClone(SETTINGS_DEFAULT); }
}
function saveSettings() { localStorage.setItem('bd.settings', JSON.stringify(S)); }
// Tabs that started out hidden in 2026-10 are hidden once for people who already had settings; after that the person's choice stands.
if ((S.tabsV || 0) < 2) {
  const H = S.hiddenTabs = { ...(S.hiddenTabs || {}) };
  for (const [k, ids] of Object.entries(SETTINGS_DEFAULT.hiddenTabs)) H[k] = [...new Set([...(H[k] || []), ...ids])];
  S.tabsV = 2; try { if (localStorage.getItem('bd.settings')) saveSettings(); } catch (e) { console.warn(e); } // a brand-new person has nothing saved yet
}

// Units — all body/lift weights are stored in kg, displayed in the user's unit
const LB = 0.45359237;
const toUnit = kg => kg == null ? null : (S.unit === 'lbs' ? kg / LB : kg);
const fromUnit = v => v == null ? null : (S.unit === 'lbs' ? v * LB : v);
const wDisp = kg => kg == null ? '' : String(round(toUnit(kg), 1));
const wFmt = kg => kg == null ? '–' : `${fmtNum(toUnit(kg), 1)} ${S.unit}`;

/* =====================================================================
   STORAGE (IndexedDB primary, localStorage fallback)
   ===================================================================== */
const COLLECTIONS = {
  workouts: [], routines: [], exercises: null, activeWorkout: null, exMeta: {}, programs: {}, foods: [], nutPlan: null, measurements: [], photoMeta: [], mfImport: null,
  nutrition: {}, meals: [],
  recipes: [], mealPlan: {}, grocery: [], pantry: [], freezer: [], gkit: {}
};
const Store = {
  db: null, ready: false, data: {}, dirty: new Set(), revisions: new Map(), failed: new Set(), flushing: null, t: null,
  async init() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('body-dashboard', 1);
        r.onupgradeneeded = () => { const db = r.result; for (const name of ['kv', 'photos', 'local']) if (!db.objectStoreNames.contains(name)) db.createObjectStore(name); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    } catch (e) {
      this.db = null;
      if (localStorage.getItem('bd.storageMode') === 'indexeddb' || (localStorage.getItem('bd.seeded') && !Object.keys(localStorage).some(k => k.startsWith('bd.data.')))) throw new Error('Saved IndexedDB data is unavailable. It has not been reset; reopen this browser with storage available.');
      console.warn('IndexedDB unavailable — falling back to localStorage', e);
    }
    if (this.db) { try { localStorage.setItem('bd.storageMode', 'indexeddb'); } catch {} }
    const keys = Object.keys(COLLECTIONS), values = await this.readMany(keys);
    for (const [i, k] of keys.entries()) {
      const v = values[i];
      this.data[k] = v === undefined ? structuredClone(COLLECTIONS[k]) : v;
    }
    await WebWrites.init();
  },
  readMany(keys) {
    if (!this.db) return Promise.all(keys.map(k => this.read(k)));
    return new Promise((res, rej) => {
      const tx = this.db.transaction('kv', 'readonly'), store = tx.objectStore('kv'), values = new Array(keys.length);
      keys.forEach((k, i) => { const q = store.get(k); q.onsuccess = () => { values[i] = q.result; }; });
      tx.oncomplete = () => res(values);
      tx.onerror = tx.onabort = () => rej(tx.error || new Error('Reading saved data was interrupted'));
    });
  },
  read(k) {
    if (!this.db) { try { const s = localStorage.getItem('bd.data.' + k); return Promise.resolve(s == null ? undefined : JSON.parse(s)); } catch (e) { return Promise.reject(e); } }
    return this.readMany([k]).then(values => values[0]);
  },
  write(k, v) { return WebWrites.snapshot({ [k]: v }); },
  writeWorkoutPair(values) { return WebWrites.snapshot(values); },
  get(k) { return this.data[k]; },
  set(k, v) { this.data[k] = v; this.save(k); },
  save(k) {
    this.dirty.add(k); this.revisions.set(k, (this.revisions.get(k) || 0) + 1);
    clearTimeout(this.t); this.t = setTimeout(() => this.flushDirty().catch(() => {}), 250);
    drawSaveRecovery();
  },
  flushDirty() {
    clearTimeout(this.t);
    if (this.flushing) return this.flushing;
    if (!this.dirty.size) return Promise.resolve();
    // One writer drains snapshots in order. A completed snapshot only acknowledges its own revision.
    this.flushing = this.drain().finally(() => { this.flushing = null; drawSaveRecovery(); });
    drawSaveRecovery();
    return this.flushing;
  },
  async drain() {
    try { syncTouch(); }
    catch (e) {
      for (const k of this.dirty) this.failed.add(k);
      drawSaveRecovery();
      throw new Error('Changes could not be saved because sync settings could not be updated. Retry saving or export a backup before closing.');
    }
    while (this.dirty.size) {
      const errors = [];
      const paired = this.dirty.has('workouts') && this.dirty.has('activeWorkout');
      if (paired) {
        const keys = ['workouts', 'activeWorkout'], revisions = keys.map(k => this.revisions.get(k));
        try {
          await this.writeWorkoutPair(Object.fromEntries(keys.map(k => [k, structuredClone(this.data[k])])));
          keys.forEach((k, i) => { if (this.revisions.get(k) === revisions[i]) this.dirty.delete(k); this.failed.delete(k); });
        } catch (e) { keys.forEach(k => this.failed.add(k)); errors.push(e); }
      }
      for (const k of [...this.dirty]) {
        if (paired && ['workouts', 'activeWorkout'].includes(k)) continue;
        const revision = this.revisions.get(k);
        try {
          await this.write(k, structuredClone(this.data[k]));
          if (this.revisions.get(k) === revision) this.dirty.delete(k);
          this.failed.delete(k);
        } catch (e) { this.failed.add(k); errors.push(e); }
        drawSaveRecovery();
      }
      if (errors.length) throw new Error('Changes could not be saved on this device. Retry saving or export a backup before closing.');
    }
  },
  async flushAll() {
    for (const k of Object.keys(this.data)) { this.dirty.add(k); this.revisions.set(k, (this.revisions.get(k) || 0) + 1); }
    await this.flushDirty();
  }

};

// All web writes use this queue. Intents and receipts are optional local metadata, never a new database.
const webJSON = value => JSON.stringify(value) ?? 'undefined';
async function webDigest(value) {
  const bytes = new TextEncoder().encode(webJSON(value));

}
const WebWrites = {
  bases: {}, pending: new Map(), tail: Promise.resolve(), busy: false, conflict: false,
  run(fn) { const result = this.tail.then(fn); this.tail = result.catch(() => {}); return result; },
  async init() {
    const keys = Object.keys(COLLECTIONS), values = await Store.readMany(keys);
    keys.forEach((k, i) => { this.bases[k] = values[i]; });
    this.pending.clear();
    if (Store.db) {
      this.context = await new Promise((resolve, reject) => {
        const tx = Store.db.transaction('local', 'readwrite'), local = tx.objectStore('local'), q = local.get('bd.web.context'); let context;
        q.onsuccess = () => { context = q.result || { version: 1, actorId: uid(), workspaceId: uid(), athleteId: uid() }; if (!q.result) local.put(context, 'bd.web.context'); };

    }
    if (Store.db) for (const [key, value] of await idbEntries('local')) {
      if (key.startsWith('bd.web.intent.') && value?.version === 1) this.pending.set(value.id, value);

  },
  async snapshot(values) {
    if (!Store.db) {
      for (const [k, v] of Object.entries(values)) localStorage.setItem('bd.data.' + k, JSON.stringify(v));
      return;
    }
    return this.run(async () => {
      const receipt = await this.apply(values, 'snapshot');
      if (receipt.alreadyCommitted) { const keys = Object.keys(values), saved = await Store.readMany(keys); keys.forEach((key, i) => { this.bases[key] = structuredClone(saved[i]); }); if (keys.some((key, i) => webJSON(saved[i]) !== webJSON(values[key]))) throw new Error('An older save already completed and newer records exist. Export pending input, then reload the saved copy.'); }
      return receipt;
    });
  },
  async command(values, purpose, extra = {}, expected) {
    if (!Store.db) throw new Error('This action needs IndexedDB. Export your data and reopen in a browser with storage available.');
    await Store.flushDirty();

      this.busy = true; drawSaveRecovery();
      try {
        const receipt = await this.apply(values, purpose, extra, bases);
        if (receipt.alreadyCommitted) {
          const keys = Object.keys(values), saved = await Store.readMany(keys);
          keys.forEach((key, i) => { this.bases[key] = structuredClone(saved[i]); Store.data[key] = saved[i] === undefined ? structuredClone(COLLECTIONS[key]) : saved[i]; });
          if (receipt.canceled) throw new Error('This action was replaced by a newer review. Refresh the review before trying again.');
        } else for (const [k, v] of Object.entries(values)) Store.data[k] = structuredClone(v);
        return receipt;
      } finally { this.busy = false; drawSaveRecovery(); }
    });
  },
  async apply(values, purpose, extra = {}, bases = this.bases, replay = null) {
    const keys = Object.keys(values), hashes = {};
    for (const k of keys) hashes[k] = await webDigest(bases[k]);
    let intent = replay || [...this.pending.values()].find(x => x.purpose === purpose && webJSON(x.values) === webJSON(values));

// Tiny Markdown renderer (headings, lists, tasks, quotes, bold/italic, code, links, [[wikilinks]], ==highlights==)
function md(src) {
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, '<code class="px-1 rounded bg-slate-100 dark:bg-slate-800 text-[0.9em]">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/==([^=]+)==/g, '<mark>$1</mark>')
    .replace(/\[\[([^\]]+)\]\]/g, '<span class="text-brand-600 dark:text-brand-400">[[$1]]</span>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  let html = '', list = null, para = [];
  const flushP = () => { if (para.length) { html += `<p>${para.map(inline).join('<br>')}</p>`; para = []; } };
  const flushL = () => { if (list) { html += `<${list.t}>${list.items.map(i => `<li>${i}</li>`).join('')}</${list.t}>`; list = null; } };
  const addLi = (t, content) => { flushP(); if (!list || list.t !== t) { flushL(); list = { t, items: [] }; } list.items.push(content); };
  for (const raw of String(src || '').replace(/\r/g, '').split('\n')) {
    const l = raw.trimEnd(); let m;
    if (!l.trim()) { flushP(); flushL(); continue; }
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { flushP(); flushL(); html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; continue; }
    if (/^(-{3,}|\*{3,})$/.test(l.trim())) { flushP(); flushL(); html += '<hr>'; continue; }
    if ((m = l.match(/^>\s?(.*)/))) { flushP(); flushL(); html += `<blockquote>${inline(m[1])}</blockquote>`; continue; }
    if ((m = l.match(/^\s*[-*+]\s+\[([ xX])\]\s+(.*)/))) { addLi('ul', `<input type="checkbox" disabled ${m[1].trim() ? 'checked' : ''}> ${inline(m[2])}`); continue; }
    if ((m = l.match(/^\s*[-*+]\s+(.*)/))) { addLi('ul', inline(m[1])); continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { addLi('ol', inline(m[1])); continue; }
    flushL(); para.push(l);
  }
  flushP(); flushL(); return html;
}

const Photos = {
  urls: new Map(), pending: new Map(),
  ok() { return !!(Store.db && Store.db.objectStoreNames.contains('photos')); },
  tx(mode) { return Store.db.transaction('photos', mode).objectStore('photos'); },
  put(id, blob) { return new Promise((res, rej) => { const tx = Store.db.transaction('photos', 'readwrite'), q = tx.objectStore('photos').put(blob, id); tx.oncomplete = res; tx.onerror = tx.onabort = () => rej(tx.error || q.error || new Error('Photo could not be saved on this device')); }); },
  get(id) { return new Promise(res => { const q = this.tx('readonly').get(id); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); },
  del(id) { this.pending.delete(id); return new Promise(res => { const t = Store.db.transaction('photos', 'readwrite'); t.objectStore('photos').delete(id); t.oncomplete = res; t.onerror = res; const u = this.urls.get(id); if (u) { URL.revokeObjectURL(u); this.urls.delete(id); } }); },
  async url(id) {

    if (this.pending.has(id)) return this.pending.get(id);
    const request = this.get(id).then(b => {
      if (!b || this.pending.get(id) !== request) return null; // Removed/replaced while the read was pending.
      const u = URL.createObjectURL(b); this.urls.set(id, u); return u;
    }).finally(() => { if (this.pending.get(id) === request) this.pending.delete(id); });
    this.pending.set(id, request); return request;
  },
  prune() {
    const visible = new Set($$('img[data-photo]').map(img => img.dataset.photo));
    for (const [id, url] of this.urls) if (!visible.has(id)) { URL.revokeObjectURL(url); this.urls.delete(id); }
    for (const id of this.pending.keys()) if (!visible.has(id)) this.pending.delete(id);

  clearURLs() { this.pending.clear(); this.urls.forEach(u => URL.revokeObjectURL(u)); this.urls.clear(); }

// --- Save a recipe from a link: a recipe page's link, or a post's link with its caption. Android's share menu
// opens it directly (manifest share_target); on iPhone, copy the link and use + → Recipe from a link.
// The link reader (reader/ in the repo, a Cloudflare Worker) fetches pages the browser may not read:
// a recipe page's full recipe, an article's text, a TikTok caption. It answers only the hosted app
// and localhost, so it is off for the copy opened as a file. Facebook and Instagram cannot be read.
const READER = { url: 'https://life-dashboard-reader.lifedashboard-9r5w.workers.dev' };

  return readerSeen.get(url);
}

  if (got) { const ni = got.ingredients.split('\n').filter(Boolean).length, ns = got.steps.split('\n').filter(Boolean).length; return `Found ${ni} ingredient${ni === 1 ? '' : 's'}${ns ? ` and ${ns} step${ns === 1 ? '' : 's'}` : ''} in the text; they will fill in the recipe.`; }
  if (readerOn() && firstUrl(text) && !readerSkips(firstUrl(text))) return 'The recipe is read from the page when you save. If the page has no recipe, paste its ingredient list after the link.';
  return 'Saved to your Recipe box with the link. Paste the caption after the link and its ingredient list fills in the recipe; otherwise add them later.';
}
function shareOpen(text = '', title = '') { ui.share = { text, title, saving: false }; shareDraw(); }
function shareDraw() {

    <div><label class="label" for="sh-text">Link or recipe text</label><textarea id="sh-text" class="input" rows="3" data-input="shareText" placeholder="Paste a recipe link, or a post's link with its caption">${esc(S_.text)}</textarea>
      <button type="button" class="btn btn-sm mt-2" data-action="sharePaste">${icon('clipboard-paste', 'w-3.5 h-3.5')} Paste</button></div>
    <div><label class="label" for="sh-title">Title</label><input id="sh-title" class="input" data-input="shareTitle" value="${esc(S_.title)}" placeholder="Filled in from the page if left blank"></div>
    <p id="sh-hint" class="text-xs muted" aria-live="polite">${shareRecipeHint(S_.text)}</p>`,
    `<button type="button" class="btn" data-action="closeModal">Cancel</button><button type="button" class="btn btn-primary" data-action="shareSave" ${S_.saving ? 'disabled' : ''}>${icon('chef-hat')} ${S_.saving ? 'Saving…' : 'Save recipe'}</button>`));

async function shareSave() {

    <div class="flex flex-wrap gap-2"><button type="button" class="btn btn-sm" data-action="syncNow" ${Sync.busy ? 'disabled' : ''}>${icon('refresh-cw', 'w-3.5 h-3.5')} Sync now</button><button type="button" class="btn btn-sm" data-action="syncCopies">${icon('history', 'w-3.5 h-3.5')} Restore from a copy…</button><button type="button" class="btn btn-sm" data-action="syncDisconnect">${icon('cloud-off', 'w-3.5 h-3.5')} Stop syncing this device</button></div>
`;
}
function syncAskFirst() {
  Modal.open(modalShell('Start syncing this device', `<p class="text-sm">Your Google Drive already holds Body Dashboard records from another device.</p>
    <p class="text-sm muted"><strong>Combine</strong> keeps everything on this device and adds what is in Drive. <strong>Use the Drive copy</strong> replaces this device’s records with the Drive copy. Photos on this device are kept either way.</p>`,
    `<button type="button" class="btn" data-action="closeModal">Not now</button><button type="button" class="btn" data-action="syncFirst" data-mode="theirs">Use the Drive copy</button><button type="button" class="btn btn-primary" data-action="syncFirst" data-mode="merge">Combine</button>`));
}
const A_SYNC = {
  syncConnect: () => { setSyncMeta({ on: true }); Sync.run({ signIn: true, announce: true }); },
  syncNow: () => Sync.run({ signIn: true, announce: true }),
  syncFirst: el => {
    if (el.dataset.mode === 'theirs' && !confirm('Replace the records on this device with the copy in Google Drive? This cannot be undone.')) return;
    Sync.first = el.dataset.mode; Sync.allowLoss = el.dataset.mode === 'theirs'; Modal.close(); Sync.run({ announce: true });
  },
  // The dated copies in Drive, newest first; choosing one opens the restore choices.
  syncCopies: async () => {
    if (!Sync.signedIn() && !(await gauthRenew(syncMeta(), setSyncMeta))) return toast('Sign in to Google first: tap Sync now, then try again.', 'error');
    Modal.open(modalShell('Restore from a copy', `<p class="text-sm muted">A copy is made the first time you sync each day: one for each of the last 7 days, then one a week for 8 weeks. Photos aren’t in copies, and restoring never removes them.</p><div id="copy-list" class="text-sm" role="status">Looking in Google Drive…</div>`, `<button type="button" class="btn" data-action="closeModal">Close</button>`));
    let list; try { list = await driveCopies(); } catch (e) { const box = $('#copy-list'); if (box) box.textContent = e.message; return; }
    const box = $('#copy-list'); if (!box) return;
    const size = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
    box.innerHTML = list.length ? list.map(c => `<div class="flex items-center gap-3 py-2 border-t border-slate-100 dark:border-slate-800"><div class="flex-1 min-w-0"><div class="font-medium">${fmtDate(c.date, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}</div>${c.size ? `<div class="text-xs muted">${size(c.size)}</div>` : ''}</div><button type="button" class="btn btn-sm" data-action="syncCopyOpen" data-id="${esc(c.id)}" data-date="${c.date}">Choose</button></div>`).join('')
      : '<p class="muted">No copies yet. The first one is made the next time this device syncs.</p>';
  },
  syncCopyOpen: async el => {
    if (ui.importing || el.disabled) return; el.disabled = true;
    try { importChoice(parseBackup(await (await driveFetch(`/drive/v3/files/${encodeURIComponent(el.dataset.id)}?alt=media`)).text()), el.dataset.date); }
    catch (e) { el.disabled = false; toast('That copy could not be opened: ' + e.message, 'error'); }
  },
  syncDisconnect: async () => { if (!confirm('Stop syncing this device? Your records stay on this device and in Google Drive.')) return; await Sync.disconnect(); toast('Sync is off on this device'); }
};

/* =====================================================================
   ACTIONS (event-delegated)
   ===================================================================== */
const A = {
  reloadSaved: async () => {
    if (!confirm('Export a backup first if you need pending input. Discard the pending actions shown here and reload the saved records?')) return;
    clearTimeout(Store.t); await WebWrites.tail;
    if (Store.db) await new Promise((resolve, reject) => { const tx = Store.db.transaction('local', 'readwrite'); for (const id of WebWrites.pending.keys()) tx.objectStore('local').delete('bd.web.intent.' + id); tx.oncomplete = resolve; tx.onerror = tx.onabort = () => reject(new Error('Could not discard pending actions. Your input is still available.')); });
    Store.dirty.clear(); Store.failed.clear(); WebWrites.pending.clear(); location.reload();
  },
  retrySave: async () => { if (Store.flushing) return; try { await WebWrites.retry(); toast('Changes saved on this device'); } catch (e) { toast(e.message, 'error'); } },
  // shell
  go: el => {if(el.dataset.view==='nutrition'){ui.nutPage=null;ui.nutTab='today';}if(el.dataset.view==='fitness'&&!Store.get('activeWorkout'))ui.fitTab='workout';go(el.dataset.view);},
  quickAdd: () => quickAddSheet(),
  qaPick: el => quickAddForm(el.dataset.what),
  dashWorkout: () => { ui.editW = null; ui.fitTab = 'workout'; go('fitness'); },
  qaWeight: f => { const v = num(fd(f).weight); if (v == null || v <= 0) return toast('Enter your weight', 'error'); ensureDay(ymd()).weight = fromUnit(v); Store.save('nutrition'); Modal.close(); savedNotice('Weight saved'); render(); },
  showMore: el => { const k = el.dataset.key; ui.more = { ...(ui.more || {}), [k]: ((ui.more || {})[k] || PAGE) + PAGE }; render(); },
  setTab: el => { ui[el.dataset.key] = el.dataset.val; if(['nutTab','recTab'].includes(el.dataset.key))ui.nutPage=null; render(); },
  tabsEdit: el => tabsEditModal(el.dataset.key),
  dashCardsEdit: () => dashCardsModal(),
  dashCardMove: el => {
    const order = dashOrder(), i = order.indexOf(el.dataset.val), j = i + +el.dataset.d; if (i < 0 || j < 0 || j >= order.length) return;
    [order[i], order[j]] = [order[j], order[i]]; S.cardOrder = order; saveSettings(); syncTouch(); dashCardsModal([el.dataset.val, el.dataset.d]);
  },
  dashCardToggle: el => { const id = el.dataset.val, h = (S.hiddenCards || []).filter(x => x !== id); S.hiddenCards = el.checked ? h : [...h, id]; saveSettings(); syncTouch(); },
  tabsToggle: el => {
    const key = el.dataset.key, id = el.dataset.val, all = (TAB_LISTS[key] || []).map(t => t[0]), H = S.hiddenTabs = { ...(S.hiddenTabs || {}) };
    const next = el.checked ? hiddenTabsFor(key).filter(x => x !== id) : [...new Set([...hiddenTabsFor(key), id])];
    if (next.length >= all.length) { el.checked = true; return toast('Keep at least one tab', 'error'); }
    H[key] = next; if (!next.length) delete H[key]; saveSettings(); syncTouch();
    if (next.includes(ui[key])) ui[key] = null;
  },
  closeModal: () => Modal.close(),
  backupLater: () => { S.backupLater = ymd(); saveSettings(); toast('The reminder will be back in a week'); render(); },
  cycleTheme: () => { S.theme = { system: 'light', light: 'dark', dark: 'system' }[S.theme] || 'system'; saveSettings(); applyTheme(); },
  // timer
  showTimer: () => { if (document.activeElement?.matches('[data-input="awSet"]')) document.activeElement.blur(); Timer.visible = true; Timer.collapsed = false; Timer.draw(); unlockAudio(); },
  timerExpand: () => { if (document.activeElement?.matches('[data-input="awSet"]')) document.activeElement.blur(); Timer.collapsed = false; Timer.draw(); },
  timerCollapse: () => { Timer.collapsed = true; Timer.draw(); },
  hideTimer: () => { Timer.visible = false; Timer.draw(); },
  timerStart: el => Timer.start(+el.dataset.v), timerAdd: el => Timer.add(+el.dataset.v), timerStop: () => Timer.stop(),
  // settings & sync
  openSettings, exportAll,
  importAll: () => pickFile('.json,application/json', text => {
    ui.pendingImport = null;
    let d; try { d = parseBackup(text); } catch (e) { return toast(e.message, 'error'); }
    importChoice(d);
  }, BACKUP_LIMIT),
  doImport: async el => {
    const d = ui.pendingImport, mode = el.dataset.mode; if (!d || ui.importing) return;
    let plan; try { plan = planBackupImport(d, mode); } catch (e) { return toast('Import stopped: ' + e.message, 'error'); }
    if (mode === 'missing' && !plan.added) { ui.pendingImport = null; Modal.close(); return toast('Nothing was missing: this device already has everything in that copy.'); }
    // Bringing Life Dashboard records into an empty app replaces only the samples, so there is nothing to confirm.
    if (mode === 'replace' && !(fromLifeDashboard(d) && !hasOwnRecords()) && !confirm('Replace current personal records and included photos with this backup? This cannot be undone.')) return;
    ui.importing = true;
    try { await commitBackupImport(plan); }
    catch (e) { return toast('Import was not saved: ' + e.message, 'error'); }
    finally { ui.importing = false; }
    ensureSeeds(); sortWorkouts(); ui.pendingImport = null; Modal.close(); syncTouch(); // restored records reach the other devices on the next sync
    toast(mode === 'replace' ? 'Backup restored' : mode === 'missing' ? `Added back ${plan.added} item${plan.added === 1 ? '' : 's'}` : 'Backup merged'); render();
  },
  persistStorage: async () => { try { const ok = await navigator.storage.persist(); toast(ok ? 'Browser will keep your data ✓' : 'Browser declined — keep exporting backups', ok ? 'ok' : 'error'); } catch (e) { toast('Not supported in this browser', 'error'); } },
  enableNotifications: async () => { if (!('Notification' in window)) return toast('Notifications not supported here', 'error'); const p = await Notification.requestPermission(); toast(p === 'granted' ? 'Notifications enabled' : 'Notifications blocked', p === 'granted' ? 'ok' : 'error'); },
  clearAll: async () => {
    if (prompt('This erases ALL Body Dashboard records, photos, downloaded libraries, settings and API keys from this browser. Type DELETE to confirm.') !== 'DELETE') return;
    await resetAllData(); Modal.close(); toast('Body Dashboard reset — all personal data was erased'); render();
  },

  saveSettings: f => {
    const v = fd(f);
    Object.assign(S, { name: v.name.trim(), theme: v.theme, unit: v.unit, restSeconds: +v.restSeconds, bwFallback: num(v.bwFallback) ? (v.unit === 'lbs' ? num(v.bwFallback) * LB : num(v.bwFallback)) : null, timerSound: v.timerSound === '1', rpe: v.rpe === '1', calBig: v.calBig === 'eaten' ? 'eaten' : 'left', fdcKey: (v.fdcKey || '').trim(), targets: { cal: num(v.t_cal) || 2000, p: num(v.t_p) || 0, c: num(v.t_c) || 0, f: num(v.t_f) || 0 } });
    const nav=[v.nav0,v.nav1,v.nav2]; if(nav.every(x=>['dashboard','fitness','nutrition'].includes(x)) && new Set(nav).size===3) S.navOrder=nav;
    saveSettings(); applyTheme(); Modal.close(); toast('Settings saved'); render();
  }
};

Object.assign(A, A_FIT, A_NUT, A_MF, A_MEALS, A_RECIPES, A_MPW, A_SYNC, A_HELP, A_SHARE, A_NUT_WORKSPACE);
for(const name of Object.keys(A))if(retiredAction(name))A[name]=()=>toast('Pantry, Grocery and Freezer have been retired. Original records remain in backups.');

/* =====================================================================
   EVENT WIRING & INIT
   ===================================================================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const ctl = e.target.closest('input, select, textarea, label'); if (ctl && ctl !== el && el.contains(ctl)) return; // let form controls inside clickable cards work
  const fn = A[el.dataset.action]; if (!fn) return console.warn('Unknown action', el.dataset.action);
  e.preventDefault(); Promise.resolve(fn(el, e)).catch(error => toast(error.message, 'error'));
});
document.addEventListener('scroll', e => { if (e.target.classList?.contains('tabs-row')) tabFade(e.target); }, true);
// A failed image leaves the recipe's name, nutrition and entry point intact; never alter its saved link.
document.addEventListener('error', e => { if (e.target.matches?.('img[data-recipe-photo]')) e.target.hidden = true; }, true);
// Phones: drag a bottom sheet down by its handle or title bar to close it
const SHEET = { el: null, y0: 0, dy: 0 };
document.addEventListener('touchstart', e => {
  const h = e.target.closest('#modal .sheet-grab, #modal .sheet-head'); if (!h || e.target.closest('button, input, select, textarea, a')) return;
  const d = h.closest('[role="dialog"]'); if (!d || d.scrollTop > 0 || !matchMedia('(max-width: 639.98px)').matches) return;
  Object.assign(SHEET, { el: d, y0: e.touches[0].clientY, dy: 0 }); d.style.transition = 'none';
}, { passive: true });
document.addEventListener('touchmove', e => { if (!SHEET.el) return; SHEET.dy = Math.max(0, e.touches[0].clientY - SHEET.y0); SHEET.el.style.transform = `translateY(${SHEET.dy}px)`; }, { passive: true });
const sheetEnd = close => { const d = SHEET.el; if (!d) return; SHEET.el = null; d.style.transition = 'transform .15s ease-out'; if (close && SHEET.dy > 90) Modal.close(); else d.style.transform = ''; };
document.addEventListener('touchend', () => sheetEnd(true), { passive: true });
document.addEventListener('touchcancel', () => sheetEnd(false), { passive: true });
document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el && A[el.dataset.input]) Promise.resolve(A[el.dataset.input](el, e)).catch(error => toast(error.message, 'error')); });
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && A[el.dataset.change]) Promise.resolve(A[el.dataset.change](el, e)).catch(error => toast(error.message, 'error')); });
document.addEventListener('submit', e => { const f = e.target.closest('[data-submit]'); if (!f) return; e.preventDefault(); const fn = A[f.dataset.submit]; if (fn) Promise.resolve(fn(f, e)).catch(error => toast(error.message, 'error')); });
document.addEventListener('focusin', e => { if (e.target.matches('[data-input="awSet"]')) { Timer.collapsed = true; Timer.draw(); e.target.select(); } });
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('[data-input="awSet"]')) { e.preventDefault(); const fields = $$('[data-input="awSet"]', e.target.closest('tr')); const next = fields[fields.indexOf(e.target) + 1] || $('[data-action="awSetDone"]', e.target.closest('tr')); next?.focus(); return; }
  if (Modal.isOpen()) { Modal.keydown(e); if (e.defaultPrevented) return; }
  const el = e.target.closest('[role="button"][data-action]');
  if (el && e.target === el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); el.click(); }
  const picker = e.target.closest('label[data-file-picker]');
  if (picker && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); picker.querySelector('input[type="file"]').click(); }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (S.theme === 'system') applyTheme(); });
// Catch up with other devices when the app comes back to the front or the connection returns.
document.addEventListener('visibilitychange', async () => {
  if (document.hidden || !syncAvailable() || !Sync.connected()) return;
  try {
    if (!Modal.isOpen() && !Sync.busy && await Sync.adopt()) { sortWorkouts(); render(); }
    if (Date.now() - new Date(syncMeta().last || 0) > 5 * 60000) Sync.auto();
  } catch (e) { toast('Could not resume sync: ' + e.message, 'error'); }
});
window.addEventListener('online', () => Sync.auto());

// The hosted copy caches its own files so it opens offline. The file:// copy never registers;
// ?pwa on localhost is for tests.
function drawOfflineState(message) {
  let el = $('#offline-state');
  if (!el) { el = document.createElement('p'); el.id = 'offline-state'; el.className = 'text-xs muted px-3 py-1 shrink-0'; el.setAttribute('role', 'status'); $('.shell-status').append(el); }
  el.textContent = message;
}
async function registerOfflineShell() {
  const local = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && new URLSearchParams(location.search).has('pwa');
  if (!('serviceWorker' in navigator) || !(location.protocol === 'https:' || local)) return;
  drawOfflineState('Preparing offline shell…');
  try {
    const registration = await navigator.serviceWorker.register('./sw.js');
    const status = () => {
      if (registration.waiting) return drawOfflineState('Update ready · save, then close all Body tabs and reopen');
      const worker = navigator.serviceWorker.controller; if (!worker) return;
      const channel = new MessageChannel(); channel.port1.onmessage = event => { drawOfflineState(event.data.ready ? 'Ready offline · local records' : 'Offline shell incomplete. Reconnect before relying on offline access.'); channel.port1.close(); };
      worker.postMessage({ type: 'BD_OFFLINE_STATUS' }, [channel.port2]);
    };
    registration.addEventListener('updatefound', () => { registration.installing?.addEventListener('statechange', status); });
    navigator.serviceWorker.addEventListener('controllerchange', status);
    await navigator.serviceWorker.ready; status();
  } catch { drawOfflineState('Offline preparation failed. Reconnect and reload before relying on offline access.'); }
}

async function init() {
  const back = await gauthFinishCode(); // a lasting sign-in comes back as ?code=…
  const signedIn = back === 'sync' || syncFinishSignIn();
  applyTheme();
  $('#header-date').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  // A browser that has never opened the app gets the start-here card instead of old release notes.
  if (!localStorage.getItem('bd.seeded') && !localStorage.getItem('bd.settings')) { S.tour = 'new'; S.newsSeen = RELEASES[0].id; saveSettings(); }
  await Store.init(); ensureSeeds(); sortWorkouts();
  render(); await Timer.restore(); drawSaveRecovery();
  try { if (navigator.storage && navigator.storage.persisted && !(await navigator.storage.persisted())) navigator.storage.persist(); } catch (e) {}
  registerOfflineShell();
  shareFromAddress();
  Sync.draw(); Sync.run({ announce: signedIn }); Store.ready = true;
}
init().catch(e => {
  console.error('Could not initialize saved data', e);
  $('#view').innerHTML = '<div class="card m-6"><h2 class="font-semibold">Could not read saved data</h2><p class="muted mt-2">Your saved data has not been reset. Reload to try again. If this continues, keep this browser profile and seek help before resetting or importing anything.</p></div>';
  toast('Could not read saved data. Reload to try again.', 'error');
});
</script>
