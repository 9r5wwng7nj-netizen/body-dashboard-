<style>
*{box-sizing:border-box}body{margin:0;background:#eef0f3;color:#20242c;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #2455d6;outline-offset:3px}button{min-height:44px} .toolbar{max-width:960px;margin:22px auto;display:flex;align-items:end;gap:18px;flex-wrap:wrap;padding:0 24px}.toolbar label{font-size:13px;font-weight:600}.toolbar select{display:block;min-height:44px;margin-top:4px;padding:7px 12px;border:1px solid #747d8c;border-radius:8px;background:white;color:#20242c}.toolbar p{margin:0;flex:1;color:#586170;font-size:13px}.board{width:932px;margin:0 auto 28px;padding:28px 44px 24px;background:#fafbfd;border:1px solid #d4dae3;border-radius:20px}.board-head{display:flex;gap:22px;align-items:start;justify-content:space-between;margin-bottom:20px}.board-head h1{font-size:32px;letter-spacing:-1.1px;margin:4px 0 5px;line-height:1.15}.eyebrow{font-size:11px;letter-spacing:1.5px;font-weight:750;text-transform:uppercase}.board-head p{font-size:14px;max-width:530px;margin:0;color:#586170}.swatches{display:flex;gap:5px;margin-top:12px}.swatches i{width:25px;height:25px;border:1px solid #0002;border-radius:50%}.pair{display:grid;grid-template-columns:390px 390px;gap:40px}.mode{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;font-weight:700;color:#586170;margin-bottom:10px;display:flex;justify-content:space-between}.phone{height:844px;width:390px;background:var(--canvas);color:var(--text);border-radius:26px;overflow:hidden;position:relative;border:1px solid var(--line);box-shadow:0 10px 24px #1b283512;font-size:15px;line-height:1.4}.phone svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.phone button{border:0;background:var(--soft);color:var(--text);border-radius:10px;min-height:44px;padding:9px 13px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:650;font-size:14px}.phone button:focus-visible,.phone input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.phone .primary{background:var(--accent);color:var(--onAccent)}.phone .quiet{background:transparent;padding:8px;min-width:44px}.phone .wide{width:100%}.phone h2,.phone h3,.phone p{margin:0}.phone h2{font-size:28px;line-height:1.15;letter-spacing:-.7px}.phone h3{font-size:19px;line-height:1.3;letter-spacing:-.3px}.muted{color:var(--muted)}.small{font-size:12px}.nums{font-variant-numeric:tabular-nums}.app-head{padding:19px 17px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);height:82px}.app-head strong{font-size:17px;flex:1;letter-spacing:-.3px}.save{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px;padding:9px 18px 0}.save svg{width:13px;height:13px}.content{padding:20px 18px 0}.page-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px}.page-head svg{width:22px}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:0 0 19px;border-bottom:1px solid var(--line);margin-bottom:23px;gap:8px}.summary span{display:block;font-size:12px;color:var(--muted)}.summary strong{display:block;font-size:20px;margin-top:4px;font-weight:650}.summary small{font-size:12px;font-weight:450}.exercise{position:relative}.exercise-head{display:flex;align-items:start;justify-content:space-between;gap:5px}.exercise-head h3{font-size:20px}.subline{font-size:12px;color:var(--muted);margin-top:6px!important}.tools{display:flex;gap:8px;margin:16px 0 21px}.tools button{font-size:12px;min-height:44px;padding:6px 10px}.tools svg{width:15px;height:15px}.matrix{margin:0 0 14px}.table-head,.set-row{display:grid;grid-template-columns:44px minmax(0,1fr) 77px 60px 44px;gap:7px;align-items:center}.table-head{color:var(--muted);font-size:11px;margin-bottom:9px;text-align:center}.table-head span:nth-child(2){text-align:left}.set-row{margin:10px 0}.previous{font-size:12px;line-height:1.35;color:var(--muted)}.set-row input{appearance:none;width:100%;height:46px;background:var(--surface);color:var(--text);border:1px solid var(--control);border-radius:9px;text-align:center;font-size:18px;font-weight:550;min-width:0;padding:0 4px;font-variant-numeric:tabular-nums}.set-row button{min-width:44px;height:46px;padding:0;font-size:15px}.set-row .accepted{background:var(--accent);color:var(--onAccent)}.set-row .draft-log{background:transparent;border:1px solid var(--control);color:var(--muted)}.accepted-row input{background:var(--soft)}.state-note{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin:13px 0 17px}.state-note svg{width:13px;height:13px}.add-set{background:var(--soft)!important;min-height:44px;width:100%;font-size:14px}.next-exercise{border-top:1px solid var(--line);margin-top:25px;padding-top:20px;display:flex;align-items:center;justify-content:space-between}.next-exercise strong{display:block;font-size:17px}.next-exercise p{margin-top:5px;font-size:12px;color:var(--muted)}.rest-band{position:absolute;bottom:20px;left:18px;right:18px;display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--soft);border-radius:12px;border:1px solid var(--line)}.rest-band strong{font-size:18px;font-variant-numeric:tabular-nums}.rest-band .rest-copy{flex:1;font-size:12px}.rest-band button{min-width:44px;padding:4px 8px}.dock{height:76px;position:absolute;bottom:0;left:0;right:0;border-top:1px solid var(--line);background:var(--surface);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 14px 15px}.dock button{flex-direction:column;gap:4px;background:transparent;color:var(--muted);font-size:11px;min-height:52px}.dock button.selected{background:var(--soft);color:var(--accent)}.dock svg{width:20px;height:20px}.day-selector{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.day-selector strong{font-size:15px}.hero{padding:19px;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:20px}.hero .cal{font-size:48px;font-weight:720;line-height:1;letter-spacing:-1.7px;margin:8px 0 5px}.hero .cal small{font-size:14px;font-weight:450;letter-spacing:0;color:var(--muted)}.pill{display:inline-block;font-size:11px;color:var(--muted);padding:5px 8px;background:var(--soft);border-radius:6px}.hero-label{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}.macro-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px}.macro-row span{display:block;font-size:11px;color:var(--muted)}.macro-row strong{display:block;font-size:14px;margin-top:4px;font-weight:650}.macro-row .meter{height:4px;border-radius:5px;background:var(--line);margin-top:8px;overflow:hidden}.meter i{display:block;height:100%;background:var(--accent);width:62%;border-radius:5px}.hero .primary{margin-top:20px;width:100%}.link-row{display:flex;gap:8px;margin-bottom:23px}.link-row button{flex:1;font-size:12px}.section-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;margin-top:22px}.section-head h3{font-size:16px}.section-head span{font-size:12px;color:var(--muted)}.food-row{display:flex;align-items:start;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line);gap:12px}.food-row strong{font-size:14px;font-weight:650}.food-row p{font-size:12px;color:var(--muted);margin-top:4px}.food-row .kcal{text-align:right;font-size:15px;font-weight:650}.food-row .kcal small{display:block;font-size:11px;color:var(--muted);font-weight:400}.partial{font-size:12px;color:var(--muted);margin-top:15px!important;line-height:1.5}.routine{padding:17px;border-radius:14px;background:var(--soft);margin-top:22px}.routine h3{margin:6px 0 8px}.routine p{font-size:12px;color:var(--muted);margin-bottom:16px}.weight{margin-top:22px;padding-top:17px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.weight strong{font-size:23px;display:block;margin-top:6px}.weight small{font-size:12px;color:var(--muted)}.trend{width:130px!important;height:62px!important;color:var(--accent);margin-top:12px}.board-footer{font-size:12px;color:#586170;margin-top:20px;display:flex;justify-content:space-between;gap:20px}.board-footer strong{color:#20242c}.phone.carbon{border-radius:18px}.carbon .hero{padding:15px 0;background:transparent;border-width:0 0 1px;border-radius:0}.carbon .hero:before{content:'';display:block;width:36px;height:4px;background:#D4E85B;margin-bottom:20px}.carbon button,.carbon .set-row input{border-radius:6px}.carbon h2{font-weight:800;letter-spacing:-1px}.carbon .routine{background:transparent;border-radius:0;border-top:2px solid var(--text);padding:18px 0}.carbon .rest-band{border-radius:6px}.carbon .dock button.selected{background:transparent;border-top:3px solid #D4E85B;border-radius:0}.coral .summary{border-top:2px solid var(--text);padding-top:14px}.coral .exercise h3{padding-left:12px;border-left:3px solid var(--accent)}.coral .hero{border:0;border-radius:0;background:transparent;padding:6px 0 17px;border-bottom:2px solid var(--text)}.coral .hero .cal{font-size:55px;letter-spacing:-2px}.coral .routine{background:transparent;border-radius:0;border-bottom:1px solid var(--line);padding:3px 0 20px}.coral .rest-band{background:var(--surface);border-left:3px solid var(--accent);border-radius:8px}.coral .app-head{border-bottom:2px solid var(--text)}.coral .macro-row{padding:13px;background:var(--soft);border-radius:8px;gap:10px}.lilac .exercise{padding:17px 12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;margin:0 -5px}.lilac .summary{background:var(--soft);padding:13px;border:0;border-radius:14px;margin-bottom:18px}.lilac .table-head,.lilac .set-row{grid-template-columns:44px minmax(0,1fr) 69px 53px 44px;gap:6px}.lilac .tools{margin-bottom:15px} </style>
<div class="toolbar"><label>Visual direction<select id="direction" aria-label="Visual direction"></select></label><label>Screen<select id="screen" aria-label="Preview screen"><option value="workout">Active workout</option><option value="nutrition">Nutrition</option><option value="today">Today</option></select></label><p>Local design exploration · light + dark side by side.<br>All content is synthetic. Preview controls do not save records.</p></div>
<main id="board" class="board" aria-label="Design pitch"></main><div id="demo-note" role="status" style="text-align:center;margin-bottom:25px;font-size:13px"></div>
<script>
const palettes=[{"id": "cobalt", "name": "Cobalt Air", "tag": "Fresh. Clear. Confident.", "pitch": "Bright neutral surfaces and decisive blue. The clearest everyday direction, with a precise gym mode.", "tradeoff": "Familiar and easy to read; less distinctive than the other directions.", "light": {"canvas": "#F3F6FA", "surface": "#FFFFFF", "text": "#172033", "muted": "#566176", "line": "#DCE2EB", "accent": "#2455D6", "onAccent": "#FFFFFF", "soft": "#EAF0FF", "control": "#7B879A"}, "dark": {"canvas": "#10151F", "surface": "#1A2230", "text": "#F4F7FD", "muted": "#B2BDD0", "line": "#354156", "accent": "#9BB7FF", "onAccent": "#142448", "soft": "#26334B", "control": "#7D8DA8"}}, {"id": "carbon", "name": "Carbon", "tag": "The training notebook.", "pitch": "Graphite, white and a tiny citrine signature. Flat, disciplined and almost entirely free of color noise.", "tradeoff": "The strongest gym character, but the least soft or welcoming.", "light": {"canvas": "#F4F5F6", "surface": "#FFFFFF", "text": "#181A1D", "muted": "#5B6068", "line": "#DFE2E6", "accent": "#202124", "onAccent": "#FFFFFF", "soft": "#EBEDF0", "control": "#7D838B"}, "dark": {"canvas": "#101112", "surface": "#1B1D1F", "text": "#F4F5F6", "muted": "#ADB2BA", "line": "#373B40", "accent": "#F4F4F2", "onAccent": "#18191B", "soft": "#272A2D", "control": "#777F89"}}, {"id": "coral", "name": "Coral Paper", "tag": "A warmer kind of progress.", "pitch": "Clean paper, graphite and restrained coral. An editorial journal with useful numbers, rather than a wall of cards.", "tradeoff": "Expressive and personal; coral needs careful separation from error messaging.", "light": {"canvas": "#FCF8F7", "surface": "#FFFFFF", "text": "#28242A", "muted": "#6D6068", "line": "#E9DCE1", "accent": "#B3354F", "onAccent": "#FFFFFF", "soft": "#F9E7EB", "control": "#9E818D"}, "dark": {"canvas": "#19171B", "surface": "#242126", "text": "#FAF5F7", "muted": "#C4B6BE", "line": "#443A43", "accent": "#F59AAF", "onAccent": "#351320", "soft": "#342730", "control": "#9D8190"}}, {"id": "lilac", "name": "Lilac Studio", "tag": "Calm focus. Modern energy.", "pitch": "Cool white, soft lilac and indigo. Friendlier grouped summaries with a crisp, practical workout matrix.", "tradeoff": "The most approachable; too many rounded panels would dilute its training focus.", "light": {"canvas": "#F6F6FC", "surface": "#FFFFFF", "text": "#211D35", "muted": "#665F7A", "line": "#DDD8EC", "accent": "#5741C7", "onAccent": "#FFFFFF", "soft": "#ECE9F8", "control": "#8C81A9"}, "dark": {"canvas": "#17151F", "surface": "#23202D", "text": "#F4F1FC", "muted": "#BDB5CF", "line": "#423A54", "accent": "#B8AAFF", "onAccent": "#251A4C", "soft": "#322C42", "control": "#8C80AC"}}, {"id": "atlantic", "name": "Atlantic", "tag": "A quiet performance instrument.", "pitch": "Petrol blue, clean white and ink navy. Compact horizontal readouts make daily numbers easy to scan.", "tradeoff": "Precise and calm, though more technical than playful.", "light": {"canvas": "#F2F7FA", "surface": "#FFFFFF", "text": "#142B36", "muted": "#526A75", "line": "#D8E4EA", "accent": "#006B80", "onAccent": "#FFFFFF", "soft": "#E0F0F4", "control": "#6A8794"}, "dark": {"canvas": "#0C1B24", "surface": "#142B37", "text": "#EEF8FC", "muted": "#AAC4D1", "line": "#294958", "accent": "#62D3E4", "onAccent": "#082B36", "soft": "#1A3B4A", "control": "#678E9F"}}];
const paths={down:'<path d="m6 9 6 6 6-6"/>',timer:'<circle cx="12" cy="14" r="8"/><path d="M12 10v4l2 2M9 2h6M12 2v4"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',note:'<path d="M12 3H5v18h14V10M12 3v7h7M8 14h7M8 17h5"/>',check:'<path d="m5 12 4 4L19 6"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="m9 5 7 7-7 7"/>',back:'<path d="m15 5-7 7 7 7"/>',home:'<path d="m3 10 9-7 9 7v11h-7v-7h-4v7H3z"/>',train:'<path d="m6 5 13 13M3 8l5-5M16 21l5-5M5 13l8-8M11 19l8-8"/>',nutrition:'<path d="M12 7c-7-6-12 4-8 11 3 5 5 2 8 2s5 3 8-2c4-7-1-17-8-11zM12 7c0-4 3-5 5-5"/>',settings:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/>',book:'<path d="M4 3h7a3 3 0 0 1 3 3v15a5 5 0 0 0-4-2H4zM14 6a3 3 0 0 1 3-3h3v16h-3a5 5 0 0 0-3 2"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[n]||paths.plus}</svg>`;
const button=(text,cls='',symbol='')=>`<button class="${cls}" type="button" ${!text?`aria-label="${({down:"Minimize workout",timer:"Rest timer",more:"More options",plus:"Quick add",settings:"Settings",back:"Previous day",arrow:"Next day"}[symbol]||"Preview action")}"`:""}>${symbol?icon(symbol):''}${text}</button>`;
function appHead(title,session=false){return `<div class="app-head">${session?button('','quiet','down'):''}<strong>${title}</strong>${session?button('','quiet','timer')+button('Finish','primary'):button('','quiet','plus')+button('','quiet','settings')}</div><div class="save">${icon('check')} Saved on device <span style="margin-left:auto">Ready offline</span></div>`}
function dock(active){return `<nav class="dock" aria-label="Primary">${[['today','Today','home'],['workout','Train','train'],['nutrition','Nutrition','nutrition']].map(([id,label,i])=>button(label,id===active?'selected':'',i)).join('')}</nav>`}
function macros(){return `<div class="macro-row">${[['Protein','112+ / 180 g',62],['Carbs','148 / 250 g',59],['Fat','42 / 75 g',56]].map(([n,v,w])=>`<div><span>${n}</span><strong class="nums">${v}</strong><div class="meter"><i style="width:${w}%"></i></div></div>`).join('')}</div>`}
function hero(action=true){return `<section class="hero"><div class="hero-label"><span>Calories left</span><span class="pill">Partial day</span></div><p class="cal nums">1,060 <small>kcal</small></p><p class="small muted">1,340 logged / 2,400 target</p>${macros()}${action?button('Log food','primary wide','plus'):''}</section>`}
function workout(){return appHead('Log workout',true)+`<div class="content"><div class="page-head"><h2 style="font-size:25px">Upper body A</h2>${button('','quiet','more')}</div><div class="summary nums"><div><span>Duration</span><strong>24:18</strong></div><div><span>Volume</span><strong>3,920 <small>lbs</small></strong></div><div><span>Saved sets</span><strong>7</strong></div></div><section class="exercise"><div class="exercise-head"><div><h3>Bench press</h3><p class="subline">Barbell · Previous: Nov 4, 2026</p></div>${button('','quiet','more')}</div><div class="tools">${button('Rest · 2:00','','timer')+button('Add note','','note')}</div><div class="matrix"><div class="table-head"><span>Set</span><span>Previous</span><span>lbs</span><span>Reps</span><span>Log</span></div>${[1,2,3].map((n,i)=>`<div class="set-row ${n<3?'accepted-row':''}"><button aria-label="Set ${n} options">${n}</button><span class="previous nums">135 × ${[10,10,8,8][i]}</span><input aria-label="Set ${n} load in pounds" value="135" inputmode="decimal"><input aria-label="Set ${n} repetitions" value="${[10,10,8,8][i]}" inputmode="numeric"><button class="${n<3?'accepted':'draft-log'}" aria-label="${n<3?'Undo saved':'Accept draft'} set ${n}">${icon('check')}</button></div>`).join('')}</div><div class="state-note">${icon('check')} Sets 1–2 saved · set 3 is a draft</div>${button('Add set','add-set','plus')}</section></div><div class="rest-band">${icon('timer')}<div class="rest-copy"><strong>1:24</strong><br><span class="muted">Rest remaining</span></div>${button('+30s')+button('Skip')}</div>`}
function nutrition(){return appHead('Nutrition')+`<div class="content"><div class="day-selector">${button('','quiet','back')}<strong>Today · Fri, Nov 6</strong>${button('','quiet','arrow')}</div>${hero()}<div class="link-row">${button('Library','','book')+button('Meal plan','','arrow')}</div><div class="section-head"><h3>Breakfast</h3><span>460 kcal</span></div><div class="food-row"><div><strong>Yogurt & oat bowl</strong><p>1 saved meal · 35 g protein</p></div><div class="kcal nums">460<small>kcal</small></div></div><div class="section-head"><h3>Lunch</h3><span>880 kcal</span></div><div class="food-row"><div><strong>Chicken rice bowl</strong><p>1.5 servings · 77 g protein</p></div><div class="kcal nums">780<small>kcal</small></div></div><div class="food-row"><div><strong>Orange</strong><p>1 large · protein unknown</p></div><div class="kcal nums">100<small>kcal</small></div></div><p class="partial">Dinner hasn’t been logged.<br>Partial day · + means some protein is unknown.</p></div>`+dock('nutrition')}
function today(){return appHead('Today')+`<div class="content"><div class="page-head"><div><p class="small muted" style="margin-bottom:7px">FRIDAY, NOVEMBER 6</p><h2>Make room for progress.</h2></div></div>${hero(false)}<div class="link-row">${button('Log food','primary','plus')+button('Log weight','','plus')}</div><section class="routine"><span class="eyebrow muted" style="font-size:10px">Next workout</span><h3>Upper body A</h3><p>5 exercises · 16 planned working sets</p>${button('Start workout','primary wide','train')}</section><div class="weight"><div><span class="small muted">Weight trend · 7-day average</span><strong class="nums">178.4 <small>lbs</small></strong><p class="small muted" style="margin-top:5px">Latest measurement Nov 6</p></div><svg class="trend" viewBox="0 0 130 62"><path d="M4 20L23 27L44 24L65 39L87 35L106 43L126 45" stroke="currentColor" stroke-width="3" fill="none"/></svg></div></div>`+dock('today')}
const dir=document.querySelector('#direction'),screen=document.querySelector('#screen');dir.innerHTML=palettes.map((p,i)=>`<option value="${p.id}">${i+1}. ${p.name}</option>`).join('');
function render(){const p=palettes.find(p=>p.id===dir.value),index=palettes.indexOf(p)+1;document.querySelector('#board').innerHTML=`<div class="board-head"><div><span class="eyebrow">Body Dashboard · Direction 0${index}</span><h1>${p.name}</h1><p><strong>${p.tag}</strong> ${p.pitch}</p></div><div class="swatches" role="img" aria-label="Palette">${[p.light.canvas,p.light.accent,p.dark.canvas,p.dark.accent].map(c=>`<i style="background:${c}"></i>`).join('')}</div></div><div class="pair">${['light','dark'].map(mode=>`<div><div class="mode"><span>${mode} mode</span><span>390 × 844</span></div><article class="phone ${p.id}" aria-label="${mode} ${screen.value} preview" style="${Object.entries(p[mode]).map(([k,v])=>`--${k}:${v}`).join(';')}">${({workout,nutrition,today}[screen.value])()}</article></div>`).join('')}</div><div class="board-footer"><span><strong>Tradeoff:</strong> ${p.tradeoff}</span><span>Synthetic UI concept<br>App unchanged</span></div>`;document.querySelectorAll('.phone .quiet').forEach(b=>{if(!b.textContent.trim()&&!b.hasAttribute('aria-label'))b.setAttribute('aria-label','Preview action')});document.querySelector('#demo-note').textContent='';}
dir.addEventListener('change',render);screen.addEventListener('change',render);document.querySelector('#board').addEventListener('click',e=>{if(e.target.closest('button'))document.querySelector('#demo-note').textContent='Visual preview only. No workout or food was saved.'});render();
</script></html>
